[project]
name = "illumini-takehome"
version = "4.0.0"
description = "Illumini take-home: match a real scraped job feed to recruiter profiles"
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.13.0",
    "google-genai==2.30.1",
    "pydantic==2.14.1",
    "orjson==3.13.0",
    "ai==0.8.0",
    "typesafe-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "pre-commit==4.7.0",
    "deepeval==4.2.6",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["v1*", "v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["v1"]
